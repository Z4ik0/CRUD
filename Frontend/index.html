<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="index.css" />
    <title>CRUD</title>
  </head>

  <body>
    <header class="Home_Header">
      <h1 class="Home_Header_H1">CRUD</h1>
    </header>
    <main class="Contenedor">
      <div class="container formulario">
        <form id="formulario">
          <div class="row mb-3">
            <label for="dbtype" class="form-label">Tipo de base de datos</label>
            <select id="dbtype" class="form-select" aria-label="Database-type">
              <option value="mysql">Relacional</option>
              <option value="mongodb">No-relacional</option>
            </select>
          </div>

          <div class="row mb-3">
            <div class="col">
              <label for="texto" class="form-label">Texto</label>
              <input
                id="texto"
                type="text"
                placeholder="Introduce cualquier texto..."
                class="form-control"
                required
              />
            </div>
            <div class="col">
              <label for="password" class="form-label">Contraseña</label>
              <input
                id="password"
                type="password"
                class="form-control"
                placeholder="Introduce una contraseña segura"
                required
              />
            </div>
          </div>
          <div class="row mb-3">
            <div class="col">
              <label for="image" class="form-label">Imagen</label>
              <input
                id="image"
                accept="image/*"
                type="file"
                class="form-control"
              />
            </div>
            <div class="col">
              <label for="date" class="form-label">Fecha</label>
              <input
                id="date"
                type="date"
                class="form-control"
                placeholder="Introduce una contraseña segura"
                required
              />
            </div>
          </div>
          <div class="row mb-3">
            <label for="long-text">Texto largo</label>
            <textarea
              name="long-text"
              class="form-control"
              id="long-text"
              placeholder="Introduce mucho texto"
              required
            ></textarea>
          </div>
          <div class="buttons">
            <button type="reset" class="btn btn-danger">Borrar datos</button>
            <button type="submit" class="btn btn-primary">
              Guardar información
            </button>
          </div>
        </form>
      </div>

      <div class="container">
        <table class="table table-bordered border-dark">
          <thead class="table-danger">
            <tr>
              <th scope="col">#</th>
              <th scope="col">Texto</th>
              <th scope="col">Contraseña</th>
              <th scope="col">Imagen</th>
              <th scope="col">Fecha</th>
              <th scope="col">Texto largo</th>
              <th scope="col">Actualizar</th>
              <th scope="col">Eliminar</th>
            </tr>
          </thead>
          <tbody id="tabla-datos"></tbody>
        </table>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="./scripts.js"></script>
  </body>
</html>
