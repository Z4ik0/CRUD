<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="index.css" />
    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <title>CRUD</title>
  </head>

  <body>
    <header class="Home_Header">
      <h1 class="Home_Header_H1">CRUD</h1>
    </header>
    <main class="Contenedor">
      <div class="container formulario">
        <form id="formulario">
          <div class="row mb-3">
            <label for="dbtype" class="form-label">Base de datos</label>
            <select id="dbtype" class="form-select" aria-label="Database-type">
              <option value="mysql">MySQL</option>
              <option value="mongodb">MongoDB</option>
            </select>
          </div>

          <div class="row mb-3">
            <div class="col">
              <label for="texto" class="form-label">Texto</label>
              <input
                id="texto"
                type="text"
                placeholder="Introduce cualquier texto..."
                class="form-control"
                required
                minlength="4"
                pattern="^[a-zA-ZÑñ0-9]+( [a-zA-ZÑñ0-9]+)*$"
                title="El usuario debe tener al menos 4 caracteres, solo letras, números y un espacio entre palabras. Se permite la letra Ñ."
              />
            </div>
            <div class="col">
              <label for="password" class="form-label">Contraseña</label>
              <input
                id="password"
                type="password"
                class="form-control"
                placeholder="Introduce una contraseña segura"
                required
                minlength="6"
                pattern="^\S+$"
                title="La contraseña debe tener al menos 6 caracteres y no puede contener espacios."
              />
            </div>
          </div>
          <div class="row mb-3">
            <div class="col">
              <label for="image" class="form-label">Imagen</label>
              <input
                id="image"
                accept="image/jpeg, image/png, image/gif"
                type="file"
                class="form-control"
                required
                title="Solo se permiten imágenes en formato JPG, PNG o GIF."
              />
            </div>
            <div class="col">
              <label for="date" class="form-label">Fecha</label>
              <input
                id="date"
                type="date"
                class="form-control"
                required
                title="Por favor, selecciona una fecha válida."
              />
            </div>
          </div>
          <div class="row mb-3">
            <label for="long-text">Comentario</label>
            <textarea
              name="long-text"
              class="form-control"
              id="long-text"
              placeholder="Introduce mucho texto"
              required
              title="Por favor, introduce un comentario."
            ></textarea>
          </div>
          <div class="buttons">
            <button type="reset" class="btn btn-danger">Borrar datos</button>
            <button type="submit" class="btn btn-primary">
              Guardar información
            </button>
          </div>
        </form>
      </div>

      <!-- Botones para seleccionar la base de datos -->
      <div class="container my-3">
        <button id="btn-mysql" class="btn btn-primary">MySQL</button>
        <button id="btn-mongodb" class="btn btn-secondary">MongoDB</button>
      </div>

      <div class="container">
        <table class="table table-bordered border-dark">
          <thead class="table-danger">
            <tr>
              <th scope="col">#</th>
              <th scope="col">Usuario</th>
              <th scope="col">Contraseña</th>
              <th scope="col">Imagen</th>
              <th scope="col">Fecha</th>
              <th scope="col">Comentario</th>
              <th scope="col">Actualizar</th>
              <th scope="col">Eliminar</th>
            </tr>
          </thead>
          <tbody id="tabla-datos"></tbody>
        </table>
      </div>

      <!-- Modal para editar registros -->
      <div
        class="modal fade"
        id="editModal"
        tabindex="-1"
        aria-labelledby="editModalLabel"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-lg"> <!-- Clase para hacer el modal más ancho -->
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="editModalLabel">Editar Registro</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <form id="edit-form">
                <div class="mb-3">
                  <label for="edit-dbtype" class="form-label">Base de datos</label>
                  <select id="edit-dbtype" class="form-select" aria-label="Database-type">
                    <option value="mysql">MySQL</option>
                    <option value="mongodb">MongoDB</option>
                  </select>
                </div>
                <div class="row">
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="edit-texto" class="form-label">Usuario</label>
                      <input
                        id="edit-texto"
                        type="text"
                        class="form-control"
                        required
                        minlength="4"
                        pattern="^[a-zA-ZÑñ0-9]+( [a-zA-ZÑñ0-9]+)*$"
                        title="El usuario debe tener al menos 4 caracteres, solo letras, números y un espacio entre palabras. Se permite la letra Ñ."
                      />
                    </div>
                    <div class="mb-3">
                      <label for="edit-password" class="form-label">Contraseña</label>
                      <input
                        id="edit-password"
                        type="password"
                        class="form-control"
                        required
                        minlength="6"
                        pattern="^\S+$"
                        title="La contraseña debe tener al menos 6 caracteres y no puede contener espacios."
                      />
                    </div>
                    <div class="mb-3">
                      <label for="edit-date" class="form-label">Fecha</label>
                      <input
                        id="edit-date"
                        type="date"
                        class="form-control"
                        required
                        title="Por favor, selecciona una fecha válida."
                      />
                    </div>
                    <div class="mb-3">
                      <label for="edit-long-text" class="form-label">Comentario</label>
                      <textarea
                        class="form-control"
                        id="edit-long-text"
                        rows="3"
                        required
                        title="Por favor, introduce un comentario."
                      ></textarea>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="mb-3 d-flex justify-content-center flex-column align-items-center">
                      <label for="edit-image-preview" class="form-label">Imagen actual</label>
                      <img
                        id="edit-image-preview"
                        src=""
                        alt="Imagen actual"
                        class="img-fluid mb-3"
                        style="max-width: 100%; height: 200px;"
                      />
                    </div>
                    <div class="mb-3">
                      <label for="edit-image" class="form-label">Subir nueva imagen</label>
                      <input
                        id="edit-image"
                        accept="image/jpeg, image/png, image/gif"
                        type="file"
                        class="form-control"
                        title="Solo se permiten imágenes en formato JPG, PNG o GIF."
                      />
                    </div>
                  </div>
                </div>
                <input type="hidden" id="edit-id" />
                <input type="hidden" id="edit-base" />
              </form>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cerrar
              </button>
              <button type="button" class="btn btn-primary" id="save-edit">
                Guardar Cambios
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./scripts.js"></script>
  </body>
</html>
